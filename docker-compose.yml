services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    # This value is saved inside the container's OS as an Environment Variable
    # If we run echo $MONGO_URI$ it will print our atlas linnk
    environment:
      - .env

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
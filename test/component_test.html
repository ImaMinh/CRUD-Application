<!-- Base HTML page for CRUD application -->

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="test.css">
        <title>Component Test Site </title>
    </head>
    <body>
        <!-- ### a.upload form ### -->
                <div class="col-12 col-md-5 p-0 justify-content-center bg-light">

                    <!-- upload form title -->
                    <div class="d-flex justify-content-center bg-dark text-light p-2">
                        <span class="fs-3 me-2">Upload Your Invoice</span>
                        <i class="bi bi-upload fs-3"></i>
                    </div>

                    <!-- upload form input section -->
                    <form id="upload-invoice-form" class="p-3 pb-lg-0 border">
                        
                    <!-- main input field -->

                        <!-- file input section-->
                        <div class="input-group">
                            <input id="upload-invoice-form-input" type="file" name="file" accept="image/png, image/jpeg, image/svg+xml, application/pdf" required class="form-control form-control-sm" >
                            <button class="btn btn-sm btn-light border" type="reset">
                                <i class="bi bi-x-circle"></i>
                                <span>Clear</span>
                            </button>
                        </div>
                        

                        <!-- drag and drop field (for future dev)-->
                        <div class="d-flex flex-column justify-content-center text-center border border-3 rounded-4 p-3 mt-3 bg-white" style="border-style: dashed!important">
                            <label for="formFile" style="cursor: pointer">
                                <i class="bi bi-cloud-upload fs-1 fw-bold"></i>
                                <div class="fs-3">Upload Your Image</div>
                                <div class="text-muted">Or Drag And Drop It Here</div>
                                <p class="lead fw-bold mt-2" style="font-size: 0.6em">
                                    <i class="bi bi-file-earmark-text"></i>
                                    Supported formats: JPEG, PNG, PDF, SVG
                                </p>
                            </label>
                        </div>

                        <!-- submit file button -->
                        <div>
                            <button id="upload-image-form-button" type="submit" class="btn btn-dark w-100 my-2">Upload & Extract</button> 
                        </div>
                    </form>
                </div>
        
        <!----- script tags ----->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="./test.js"></script>
    </body>
</html>

<!-- Base HTML page for CRUD application -->

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="test.css">
        <title>Component Test Site </title>
    </head>
    <body>
        <section>
            <div id="data-cards-container" class="container-lg">
            </div>
        </section>

        <!-- Data Cards Template -->
        <template id="uploaded-invoice-display-card-template"> 
            <!-- Invoice Card -->
            <div class="card bg-light shadow-sm mb-4">
                
                <!-- card-header -->
                <div id="invoice-card-header" class="card-header bg-dark text-white p-1 px-3">
                    <div class="row align-items-center">

                        <!-- header `INVOICE` title-->
                        <div class="col-lg-8">
                            <div>
                                <span class="fs-lg-3 fs-4">INVOICE</span> <span class="badge bg-dark text-white text-center p-0 fs-lg-3 fs-4" id="badge"><i class="bi bi-receipt"></i></span> 
                            </div>  
                        </div>

                        <!-- header invoice information (date, number)-->
                        <div class="col-lg-4 text-lg-end mt-2 mt-md-0">
                            <div class="mb-0">
                                <span style="color: red;">*</span>
                                <span>Invoice</span> 
                                <strong id="invoice-card-header-number" class="display-field"></strong>
                            </div>
                            <div>
                                <span style="color: red;">*</span>
                                <span class="mb-0 opacity-75">Date: </span> 
                                <span id="invoice-card-header-date"></span>
                            </div>
                            
                        </div>
                    </div>
                </div>

                <!-- header information + line items section (card body)-->
                <div class="card-body">
                    
                    <!-- header information (vendor details, bill to details) -->
                    
                    <!-- header info section title -->
                    <h5 class="mb-1">Header Info</h5>
                      
                    <!-- header info section body -->
                    <div class="row g-2 mb-2">
                        
                        <!-- vendor name & vendor address section-->
                        <div class="col-md-6">
                            <div class="card h-100">

                                <!-- vendor details section wrapper card body -->
                                <div class="card-body">
                                    <!-- vendor details title -->
                                    <h6 class="text-muted fw-bold text-uppercase small mb-2">Vendor Details</h6>                         
                                    
                                    <!-- wrapper div -->
                                    <div> 

                                        <!-- vendor name -->
                                        <div class="mb-1 d-flex align-items-center" id="vendor-name">
                                            <span class="fw-bold flex-shrink-0 me-2">- vendor name: </span>
                                            <div class="value-scroll-container">
                                                <span id="card-body-header-information-vendor-name" class="field-display"></span>
                                                <input type="text" class="rounded-0 form-control form-control-sm d-none field-edit" data-field="vendor_name">
                                            </div>
                                        </div>

                                        <!-- vendor address -->
                                        <div class="mb-0 d-flex align-items-center" id="vendor-address">
                                            <span class="fw-bold flex-shrink-0 me-2">- vendor address: </span>
                                            <div class="value-scroll-container">
                                                <span id="card-body-header-information-vendor-address" class="field-display"></span>
                                                <input type="text" class="rounded-0 form-control form-control-sm d-none field-edit" data-field="vendor_address">
                                            </div>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>

                        <!-- bill to name & bill to address section-->
                        <div class="col-md-6">
                            <div class="card h-100">

                                <!-- bill to details section wrapper card body -->
                                <div class="card-body">

                                    <!-- bill to details section title -->
                                    <h6 class="text-muted fw-bold text-uppercase small mb-2">Bill To</h6>

                                    <!-- wrapper div -->
                                    <div>

                                        <!-- bill to name -->
                                        <div class="mb-1 d-flex align-items-center" id="bill-to-name">
                                            <span class="fw-bold flex-shrink-0 me-2">- bill to name: </span>
                                            <div class="value-scroll-container">
                                                <span id="card-body-header-information-bill-to-name" class="field-display"></span>
                                                <input type="text" class="rounded-0 form-control form-control-sm d-none field-edit" data-field="bill_to_name">
                                            </div>
                                        </div>

                                        <!-- bill to address -->
                                        <div class="mb-0 d-flex align-items-center" id="bill-to-address">
                                            <span class="fw-bold flex-shrink-0 me-2">- bill to address: </span>
                                            <div class="value-scroll-container">
                                                <span id="card-body-header-information-bill-to-address" class="field-display"></span>
                                                <input type="text" class="rounded-0 form-control form-control-sm d-none field-edit" data-field="bill_to_address">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>

                    <!-- invoice details (invoice number, invoice date, etc.) -->
                    <h5 class="mb-1">Invoice Details</h5>
                    <div class="card mb-2">
                        <div class="card-body">
                            <div class="row g-2">

                                <!-- invoice number -->
                                <div class="col-md-3">
                                    <h6 id="card-body-invoice-details-invoice-number-title" class="text-muted fw-bold text-uppercase small mb-2">Invoice Number</h6>
                                    <div class="value-scroll-container">
                                        <span id="card-body-invoice-details-invoice-number" class="field-display"></span>
                                        <input type="text" class="rounded-0 form-control form-control-sm d-none field-edit" data-field="invoice_number">
                                    </div>
                                </div>

                                <!-- invoice date -->
                                <div class="col-md-3">
                                    <h6 id="card-body-invoice-details-invoice-date-title" class="text-muted fw-bold text-uppercase small mb-2">Invoice Date</h6>
                                    <div class="value-scroll-container">
                                        <span id="card-body-invoice-details-invoice-date" class="field-display"></span>
                                        <input type="text" class="rounded-0 form-control form-control-sm d-none field-edit" data-field="invoice_date">
                                    </div>
                                </div>

                                <!-- due date -->
                                <div class="col-md-3">
                                    <h6 id="card-body-invoice-details-due-date-title" class="text-muted fw-bold text-uppercase small mb-2">Due Date</h6>
                                    <div class="value-scroll-container">
                                        <span id="card-body-invoice-datails-due-date" class="field-display"></span>
                                        <input type="text" class="rounded-0 form-control form-control-sm d-none field-edit" data-field="due_date">
                                    </div>
                                </div>

                                <!-- payment terms -->
                                <div class="col-md-3">
                                    <h6 id="card-body-invoice-details-invoice-payment-terms-title" class="text-muted fw-bold text-uppercase small mb-2">Payment Terms</h6>
                                    <div class="value-scroll-container">
                                        <span id="card-body-invoice-details-invoice-payment-terms" class="field-display"></span>
                                        <input type="text" class="rounded-0 form-control form-control-sm d-none field-edit" data-field="payment_terms">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Line Items -->
                    <h5 class="mb-1">Line Items</h5>
                    <div class="mb-2 bg-white p-3 border rounded-3 overflow-x-auto">
                        <table id="card-body-invoice-line-items-table" class="table table-hover table-sm mb-0 table-bordered">
                            <thead id="card-body-invoice-line-items-table-head" class="table-light">
                                <tr>
                                    <th>Description</th>
                                    <th class="text-center">Qty</th>
                                    <th class="text-center">Unit Price</th>
                                    <th class="text-center">Amount</th>
                                </tr>
                            </thead>

                            <tbody id="card-body-invoice-line-items-table-body">
                                <tr>
                                    <td colspan="4" class="text-center text-muted">No line items</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Totals -->
                    <h5 class="mb-1">Totals</h5>
                    <div class="card mb-2">
                        <div class="card-body">
                            <div class="row g-2">
                                
                                <!-- Currency -->
                                <div class="col-md-3">
                                    <h6 class="text-muted fw-bold text-uppercase small mb-2">Currency</h6>
                                    <div class="value-scroll-container ps-1">
                                        <span id="card-body-totals-currency" class="field-display fw-bold fs-6"></span>
                                        <input type="text" class="rounded-0 form-control form-control-sm d-none field-edit" data-field="currency">
                                    </div>
                                </div>
                                
                                <!-- Subtotal -->
                                <div class="col-md-3">
                                    <h6 class="text-muted fw-bold text-uppercase small mb-2">Subtotal</h6>
                                    <div class="value-scroll-container">
                                        <span id="card-body-totals-subtotal" class="field-display"></span>
                                        <input type="text" class="rounded-0 form-control form-control-sm d-none field-edit" data-field="subtotal">
                                    </div>
                                </div>

                                <!-- Tax -->
                                <div class="col-md-3">
                                    <h6 class="text-muted fw-bold text-uppercase small mb-2">Tax</h6>
                                    <div class="value-scroll-container">
                                        <span id="card-body-totals-tax" class="field-display"></span>
                                        <input type="text" class="rounded-0 form-control form-control-sm d-none field-edit" data-field="tax">
                                    </div>
                                </div>

                                <!-- Total -->
                                <div class="col-md-3">
                                    <h6 class="text-muted fw-bold text-uppercase small mb-2">Total</h6>
                                    <div class="value-scroll-container">
                                        <span id="card-body-totals-total" class="field-display fw-bold fs-6"></span>
                                        <input type="text" class="rounded-0 form-control form-control-sm d-none field-edit" data-field="grand_total">
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>

                <!-- Footer -->
                <div class="card-footer text-muted text-center">
                    <small>
                        Invoice ID: <span id="invoice-id">-</span> | 
                        Generated: <span id="generated-date">-</span>
                    </small>
                </div>

                <!-- Actions -->
                <div class="card-footer bg-white no-print">
                    <div class="row g-2">
                        <div class="col-auto">
                            <button class="btn btn-primary" onclick="window.print()">
                                <i class="bi bi-printer"></i> Export
                            </button>
                        </div>
                        <div class="col-auto">
                            <button id="uploaded-invoice-display-card-edit-button" type="button" class="btn btn-dark">
                                <i class="bi bi-pencil"></i> Edit
                            </button>
                        </div>
                        <div class="col-auto">
                            <button class="btn btn-danger" onclick="deleteInvoice()">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </template>
        
        <!-- Data Cards Line Item Template-->
        <template id="uploaded-invoice-display-card-inline-item-template">
            <tr>
                <!-- Description (scrollable if long) -->
                <td>
                    <div class="value-scroll-container">
                        <span id="data-cards-line-item-description" class="field-display"></span>
                        <input type="text" class="rounded-0 form-control form-control-sm d-none field-edit" data-field="description" data-type="line-item">
                    </div>
                </td>

                <!-- Quantity (centered) -->
                <td class="text-center">
                    <span id="data-cards-line-item-quantity" class="field-display"></span>
                    <input type="number" class="rounded-0 form-control form-control-sm d-none field-edit" data-field="quantity" data-type="line-item">
                </td>

                <!-- Unit Price (centered) -->
                <td class="text-center">
                    <span id="data-cards-line-item-unit-price" class="field-display"></span>
                    <input type="text" class="rounded-0 form-control form-control-sm d-none field-edit" data-field="unit_price" data-type="line-item">
                </td>

                <!-- Amount (centered) -->
                <td>
                    <span id="data-cards-line-item-amount" class="field-display"></span>
                    <input type="text" class="rounded-0 form-control form-control-sm d-none field-edit" data-field="amount" data-type="line-item">
                </td>
            </tr>
        </template>

        <!----- script tags ----->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="./component_test.js"></script>
    </body>
</html>
